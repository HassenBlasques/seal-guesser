<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Seal Guesser 🦭</title>
<style>
:root{--bg:#07111f;--card:#111c2e;--text:#f8fafc;--muted:#9fb0c6;--line:#27364d;--accent:#38bdf8;--ok:#22c55e;--bad:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#07111f,#0a1526);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:16px}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:clamp(28px,5vw,40px)}.score{background:#0d2236;border:1px solid #204361;padding:8px 12px;border-radius:999px;font-weight:800}
.card{background:rgba(17,28,46,.96);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 18px 55px #0005}
.photo{aspect-ratio:4/3;background:#050b13;border-radius:16px;display:grid;place-items:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:contain}.round{position:absolute;left:10px;top:10px;background:#020617cc;border:1px solid #334155;border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px}
.prompt{font-size:22px;font-weight:850;margin:16px 2px 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer}.choice,.next,.restart{border:0;border-radius:14px;padding:13px 14px;font-weight:800}
.choice{background:#17263d;color:white;border:1px solid #2b3a55;text-align:left}.choice:hover{background:#1d304d}.choice:disabled{cursor:default}
.choice.correct{background:#11351f;border-color:#2d8b52}.choice.wrong{background:#421923;border-color:#a72d48}
.feedback{min-height:74px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;line-height:1.45;color:#dbe5f2}
.next{display:none;width:100%;margin-top:12px;background:var(--accent);color:#052235}.settings{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:14px}
select{background:#101c30;color:white;border:1px solid #334155;border-radius:10px;padding:8px 10px}.tiny{color:#7f91a9;font-size:12px;margin-top:10px}
.end{text-align:center;padding:30px 10px}.restart{background:var(--ok);color:#052914}
@media(max-width:560px){body{padding:10px}.choices{grid-template-columns:1fr}.card{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>🦭 Seal Guesser</h1>
    <div class="score" id="score">0 / 0</div>
  </div>
  <div class="card" id="game">
    <div class="photo">
      <img id="sealPhoto" alt="Tuleň k určení">
      <div class="round" id="round">Kolo 1 / 5</div>
    </div>
    <div class="prompt">Jaký je to druh?</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback">Vyber jednu možnost.</div>
    <button class="next" id="next">Další tuleň →</button>
    <div class="settings">
      <label>Počet kol:
        <select id="roundCount"><option>5</option><option selected>10</option></select>
      </label>
    </div>
    <div class="tiny">Obrázky jsou součástí webu, nic se nenačítá z externích serverů.</div>
  </div>
</div>

<script>
const species = [
  {name:"tuleň obecný", latin:"Phoca vitulina", img:"images/seal01.svg", clue:"Kulatá hlava, krátký čenich a skvrnitá srst."},
  {name:"tuleň kuželozubý", latin:"Halichoerus grypus", img:"images/seal02.svg", clue:"Delší profil hlavy a výraznější nos."},
  {name:"tuleň kroužkovaný", latin:"Pusa hispida", img:"images/seal03.svg", clue:"Typické světlé kroužky na tmavší srsti."},
  {name:"tuleň grónský", latin:"Pagophilus groenlandicus", img:"images/seal04.svg", clue:"Dospělci mívají výraznou tmavou kresbu ve tvaru harfy."},
  {name:"tuleň leopardí", latin:"Hydrurga leptonyx", img:"images/seal05.svg", clue:"Dlouhá hlava, velká tlama a skvrny na krku a bocích."},
  {name:"tuleň Weddellův", latin:"Leptonychotes weddellii", img:"images/seal06.svg", clue:"Robustní antarktický tuleň s krátkým čenichem."},
  {name:"tuleň krabožravý", latin:"Lobodon carcinophaga", img:"images/seal07.svg", clue:"Štíhlejší antarktický druh, často světlejší."},
  {name:"tuleň vousatý", latin:"Erignathus barbatus", img:"images/seal08.svg", clue:"Velmi nápadné, dlouhé a husté vousy."},
  {name:"čepcol hřebenatý", latin:"Cystophora cristata", img:"images/seal09.svg", clue:"Samec má nápadný nafukovací vak na hlavě a nose."},
  {name:"tuleň středomořský", latin:"Monachus monachus", img:"images/seal10.svg", clue:"Velký středomořský druh s tmavou hladší srstí."}
];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let deck=[],idx=0,correct=0,answered=0,current=null;

const el=id=>document.getElementById(id);
function newGame(){
  const n=Math.min(Number(el("roundCount").value),species.length);
  deck=shuffle(species).slice(0,n); idx=0; correct=0; answered=0;
  el("score").textContent="0 / 0"; showRound();
}
function showRound(){
  if(idx>=deck.length) return endGame();
  current=deck[idx];
  el("round").textContent=`Kolo ${idx+1} / ${deck.length}`;
  el("sealPhoto").src=current.img;
  el("feedback").textContent="Vyber jednu možnost.";
  el("next").style.display="none";
  const choices=shuffle([current,...shuffle(species.filter(s=>s!==current)).slice(0,3)]);
  const box=el("choices"); box.innerHTML="";
  choices.forEach(s=>{
    const b=document.createElement("button");
    b.className="choice"; b.textContent=s.name;
    b.onclick=()=>answer(s,b); box.appendChild(b);
  });
}
function answer(sel,btn){
  if(answered>idx) return;
  answered++;
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent===current.name)b.classList.add("correct")});
  if(sel===current){correct++; btn.classList.add("correct"); el("feedback").innerHTML=`✅ <strong>Správně!</strong> Je to <strong>${current.name}</strong> (<em>${current.latin}</em>).<br>${current.clue}`;}
  else{btn.classList.add("wrong"); el("feedback").innerHTML=`❌ Je to <strong>${current.name}</strong> (<em>${current.latin}</em>).<br>${current.clue}`;}
  el("score").textContent=`${correct} / ${answered}`; el("next").style.display="block";
}
el("next").onclick=()=>{idx++;showRound()};
el("roundCount").onchange=newGame;
function endGame(){
  el("game").innerHTML=`<div class="end"><div style="font-size:64px">🦭</div><h2>${correct} / ${deck.length}</h2><p>Hotovo.</p><button class="restart" onclick="location.reload()">Hrát znovu</button></div>`;
}
newGame();
</script>
</body>
</html>
